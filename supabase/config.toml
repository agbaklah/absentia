project_id = "uftjspyyihaqvqxemfnc"

# New accounts sign in immediately — no email confirmation step.
[auth]
enabled = true
# Local dev URL (README). Remote email links are constructed from this.
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080", "http://127.0.0.1:8080"]
# Hosted issuer for this project, so JWT iss claims are correct.
jwt_issuer = "https://uftjspyyihaqvqxemfnc.supabase.co/auth/v1"

[auth.email]
enable_confirmations = false

# Local stack ports — offset from the defaults so this project can run
# alongside other local Supabase projects on the same machine.
[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false
port = 55329

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55324

[analytics]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[realtime]
enabled = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 55383
